# The suite behind the README badge, run by the platform instead of a maintainer's memory.
# Two jobs the repository already defines for itself: the 89-check suite, then the
# confidentiality scan in its shipped-pattern mode. Both are offline by design.
name: suite
# The runner ships no locale; grep under C treats the latin-1 control as binary and excuses it,
# which the unscannable-census check correctly refuses. Pin the locale the suite is proven under.
env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    # macos runner: the suite is proven on BSD userland; its first ubuntu run surfaced two real
    # portability defects (GNU grep accepts the malformed pattern the fail-closed test plants;
    # the removal-path check prints an empty reason) - registered, to be fixed as their own pass.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: the package's own suite
        run: bash tests/run-tests.sh
      - name: publish-lint, shipped pattern set
        run: bash scripts/publish-lint.sh
